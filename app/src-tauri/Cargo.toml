[package]
name = "libreria-app"
description = "Librería SIGLO XXI: inventario, búsqueda, ventas y encargos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "libreria_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libreria-core = { path = "../../crates/core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = "4.2.0"
# servidor local para los celulares (HTTPS con certificado propio)
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "http1", "tokio", "service"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = "0.13"
tower-http = { version = "0.6", features = ["cors"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"
sha2 = "0.10"
hex = "0.4"
