[package]
name = "libreria-app"
description = "Librería SIGLO XXI: inventario, búsqueda, ventas y encargos"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "libreria_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# cliente HTTPS del celular (fija el certificado del PC por su huella)
hyper = { version = "1", features = ["server", "client", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server", "client", "http1", "tokio", "service"] }
tokio = { version = "1", features = ["net", "sync", "time", "rt", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.10"
hex = "0.4"

# Solo en el PC: la base cifrada, el llavero, el servidor para los celulares…
[target.'cfg(not(target_os = "android"))'.dependencies]
libreria-core = { path = "../../crates/core" }
tauri-plugin-dialog = "2"
keyring = "4.2.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
rcgen = "0.13"
tower-http = { version = "0.6", features = ["cors"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
local-ip-address = "0.6"

# Solo en el celular: lector de códigos de barras y QR
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-barcode-scanner = "2"

[dev-dependencies]
tempfile = "3"
