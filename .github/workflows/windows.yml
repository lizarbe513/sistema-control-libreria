name: Instalador de Windows

# Con una etiqueta v* (git tag v1.0.1 && git push --tags) o a mano. Deja el instalador firmado como «artifact»;
# scripts/publicar.sh lo sube al repositorio público de versiones, de donde la app lo descarga para actualizarse.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # SQLCipher (OpenSSL incluido), el llavero de Windows y las rutas: se prueban en Windows de verdad
      - name: Pruebas del núcleo
        run: cargo test -p libreria-core
      - name: Pruebas de la app
        run: cargo test -p libreria-app

      - name: Interfaz
        working-directory: ui
        run: npm ci
      - name: Instalador
        run: |
          npm install -g @tauri-apps/cli@2
          tauri build --ci
        working-directory: app

      - name: Ordenar el instalador
        shell: bash
        run: |
          mkdir salida
          exe=$(ls target/release/bundle/nsis/*-setup.exe | head -1)
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          cp "$exe" "salida/Libreria-SIGLO-XXI-${version}-setup.exe"
          cp "$exe.sig" "salida/Libreria-SIGLO-XXI-${version}-setup.exe.sig"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ls -la salida

      # Instalar de verdad, abrir la app y comprobar que sigue viva
      - name: Prueba de humo
        shell: pwsh
        run: |
          $setup = Get-ChildItem salida\*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          $carpeta = Join-Path $env:LOCALAPPDATA 'Programs'
          $app = Get-ChildItem $carpeta -Recurse -Filter '*.exe' |
            Where-Object { $_.Name -notmatch 'unins|uninstall' -and $_.DirectoryName -match 'SIGLO' } | Select-Object -First 1
          if (-not $app) { Get-ChildItem $carpeta -Recurse | Select-Object -First 30 | Out-Host; throw 'No se encontró la app instalada' }
          Write-Host "Instalada en $($app.FullName)"
          $p = Start-Process -FilePath $app.FullName -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) { throw "La app se cerró sola (código $($p.ExitCode))" }
          Write-Host "La app sigue abierta (PID $($p.Id)); ventana: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: instalador-${{ env.VERSION }}
          path: salida/*
          if-no-files-found: error
