[package]
name = "libreria-core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
getrandom = "0.4.3"
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "charset", "http2", "query"] }
rusqlite = { version = "0.40.2", features = ["bundled-sqlcipher-vendored-openssl", "functions"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
strsim = "0.11.1"
thiserror = "2.0.21"
unicode-normalization = "0.1.25"
uuid = { version = "1.28.0", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
